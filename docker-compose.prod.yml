# Production stack. All secrets come from the environment (or a sibling .env file that is NOT
# committed — see deploy/.env.prod.example). Host-agnostic: a managed host may instead provide
# Postgres/Redis and its own TLS, in which case drop those services / the caddy service.
#
# Each app service carries both `image:` and `build:`. `docker compose build` (or `up --build`)
# builds locally and tags it as `image:`; CD instead runs `docker compose pull` to fetch the same
# tag from GHCR. The API and frontend are NOT published to the host — only Caddy is — so the API
# cannot be reached except through the proxy (keeps ForwardedHeaders__TrustAllProxies safe).

# Cap container log growth: without this the default json-file driver keeps every line forever
# and can fill the host disk. 10MB × 3 files per service is plenty for `docker logs` debugging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moveli}
      POSTGRES_USER: ${POSTGRES_USER:-moveli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moveli} -d ${POSTGRES_DB:-moveli}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/nikakakash/moveli-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/Moveli.API/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-moveli};Username=${POSTGRES_USER:-moveli};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-moveli.ge}
      Jwt__Audience: ${JWT_AUDIENCE:-moveli.ge}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-https://moveli.ge}
      Frontend__BaseUrl: ${FRONTEND_ORIGIN:-https://moveli.ge}
      DataProtection__KeysPath: /keys
      Storage__UploadsPath: /uploads
      # Optional: object storage (set Storage__Provider=S3 to enable durable uploads)
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__S3__ServiceUrl: ${S3_SERVICE_URL:-}
      Storage__S3__Bucket: ${S3_BUCKET:-}
      Storage__S3__AccessKey: ${S3_ACCESS_KEY:-}
      Storage__S3__SecretKey: ${S3_SECRET_KEY:-}
      Storage__S3__PublicBaseUrl: ${S3_PUBLIC_BASE_URL:-}
      # Optional: SMTP for transactional email (omit Email__Host to log instead of send)
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__User: ${SMTP_USER:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM:-no-reply@moveli.ge}
      # Optional: provision the first admin (created only if both are set)
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      # The API is only reachable via Caddy on the internal network, so trusting the proxy is safe.
      ForwardedHeaders__TrustAllProxies: ${TRUST_ALL_PROXIES:-true}
    volumes:
      - dp_keys:/keys
      - uploads:/uploads
    expose:
      - "8080"

  frontend:
    image: ghcr.io/nikakakash/moveli-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://moveli.ge}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-moveli.ge}
      API_DOMAIN: ${API_DOMAIN:-api.moveli.ge}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Let's Encrypt}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  dp_keys:
  uploads:
  caddy_data:
  caddy_config:
