name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Build
        run: dotnet build src/Moveli.API --configuration Release
      - name: Test
        run: dotnet test tests/Moveli.Tests --configuration Release

  # Boots the real API image against real Postgres + Redis. A Healthy /health proves migrations
  # apply, seeding works, and the Postgres/Redis startup paths are wired correctly — coverage the
  # SQLite/mocked unit tests can't give.
  migrations-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: moveli
          POSTGRES_USER: moveli
          POSTGRES_PASSWORD: moveli_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moveli" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f src/Moveli.API/Dockerfile -t moveli-api:ci .
      - name: Run API against Postgres + Redis
        run: |
          docker run -d --name moveli-api --network host \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e "ConnectionStrings__DefaultConnection=Host=localhost;Port=5432;Database=moveli;Username=moveli;Password=moveli_ci" \
            -e "ConnectionStrings__Redis=localhost:6379" \
            -e "Jwt__Secret=ci-only-not-a-real-secret-please-ignore-0123456789" \
            -e "DataProtection__KeysPath=/keys" \
            -e "Storage__UploadsPath=/uploads" \
            moveli-api:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health | grep -qi healthy; then
              echo "API is healthy"; exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy in time"; exit 1
      - name: Dump API logs on failure
        if: failure()
        run: docker logs moveli-api || true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      # Fail the build on High/Critical advisories in shipped (transitive) NuGet packages.
      - name: .NET vulnerable packages
        run: |
          dotnet restore src/Moveli.API/Moveli.API.csproj
          dotnet list src/Moveli.API/Moveli.API.csproj package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qiE '\b(Critical|High)\b' vuln.txt; then
            echo "::error::High/Critical vulnerable NuGet packages found"; exit 1
          fi
          echo "No High/Critical NuGet advisories."
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (production deps)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Lint is informational for now (pre-existing baseline issues); does not fail the build.
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.moveli.ge/api
          NEXT_PUBLIC_SITE_URL: https://moveli.ge
